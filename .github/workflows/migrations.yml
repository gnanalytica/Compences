name: Migrations

# Vercel deploys the app the moment main moves, and Supabase's GitHub
# integration ("Deploy to production") applies new files in supabase/migrations
# on the same push. They finish at different times, and the integration can
# fail on its own. This watches the gap between the two, so a migration that
# never got applied shows up as a red check rather than as a resident reporting
# that a button does nothing.
on:
  push:
    branches: [main]
  schedule:
    # Catches drift that no push would notice — a migration applied by hand and
    # rolled back, or a branch merged while the database was unreachable.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pending:
    name: Production has every migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # SUPABASE_DB_URL is the production connection string, from Supabase →
      # Connect → Session pooler. It has to be the pooler one: the direct
      # db.<ref>.supabase.co name resolves to IPv6 only and these runners are
      # IPv4, so a direct string fails on the network instead of on the schema.
      # Without the secret this job fails rather than skipping: a check that
      # silently passes is the failure it guards against.
      - name: Compare supabase/migrations with the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/migrations-pending.sh
